<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Figtree:wght@400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: store = framed film hero → category index → shop grid; admin = sticky side nav + working canvas; bag, product, checkout and records slide over the page */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --panel:#F3F1F5; --ink:#17141D; --muted:#625C6E; --line:#E3DFE8; --on-err:#FFFFFF; --veil:rgba(255,255,255,.9); color-scheme:light;
  --ribbon:#AE2A4F; --ribbon-ink:#FFFFFF; --gold:#9C7A3A; --ok:#2C7A57; --err:#B3261E; --warn:#A86A12; --info:#2F5DA8; --violet:#6A44B0;
  --stage:#15111C; --stage-ink:#F5F0F7; --scrim:rgba(18,14,24,.48);
  --sw-bg:#F6D6E1; --sw-ink:#2A1420; --sw-line:rgba(42,20,32,.22); --sm-bg:#16181F; --sm-ink:#EEF1F6; --sm-line:rgba(238,241,246,.22);
  --head:#0D0B0F; --head-ink:#FFFFFF; --head-soft:#B8B2BF; --head-line:#2A2530; --head-field:rgba(255,255,255,.1); --head-accent:#FFFFFF; --bar:#0D0B0F; --bar-ink:#D9D4DE; --bar-pink:#FF8FB5;
  --display:"Bodoni Moda","Amiri","Didot","Bodoni 72",Georgia,serif;
  --body:"Figtree","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
:root[data-gb-theme="black"]{
  --bg:#000000; --surface:#111113; --panel:#1B1B1E; --ink:#F4F2F6; --muted:#A8A3B0; --line:#2C2B30; --on-err:#1A0B0A; --veil:rgba(0,0,0,.88);
  --ribbon:#F27BA0; --ribbon-ink:#1A0B11; --gold:#D3B172; --ok:#5DC497; --err:#F2786E; --warn:#E3A84C; --info:#7FA6EE; --violet:#B39AF0;
  --stage:#0A0A0B; --sw-bg:#3B1627; --sw-ink:#FFE6EF; --sw-line:rgba(255,230,239,.22); --sm-bg:#1C2029; --sm-ink:#EEF1F6; --scrim:rgba(0,0,0,.7);
  --head:#000000; --head-line:#2A2A2E; --bar:#000000; color-scheme:dark }
html{background:var(--bg)}
body,.drawer,.modal,.top,.announce,.box,.card,.chip,.order-card,.co-step{transition:background-color .25s ease,color .25s ease,border-color .25s ease}
@media (prefers-reduced-motion: reduce){body,.drawer,.modal,.top,.announce,.box,.card,.chip,.order-card,.co-step{transition:none}}
/* theme switch */
.theme-btn{position:relative}
.theme-btn .ico-sun{display:none}
:root[data-gb-theme="black"] .theme-btn .ico-sun{display:block}
:root[data-gb-theme="black"] .theme-btn .ico-moon{display:none}
.m-theme{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px 14px;border-bottom:1px solid var(--line)}
.m-theme > span{font-size:14px;color:var(--muted);font-weight:600}
.tseg{display:inline-flex;padding:3px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.mnav .tseg button,.tseg button{border:0!important;background:transparent;color:var(--muted);border-radius:999px;padding:7px 14px!important;font-size:14px!important;line-height:1.3;font-weight:600;display:inline-flex;align-items:center;gap:7px;font-family:var(--body)!important}
.mnav .tseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
body{margin:0}
@media (max-width:400px){.top .logo svg{display:none}.top-in{gap:4px}.top .pill-btn{padding:0 9px}}
.tseg button i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted)}
.tseg button[data-v="black"] i{background:#000}
.tseg button[data-v="white"] i{background:#fff}
.tseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tseg button[aria-pressed="true"] i{box-shadow:inset 0 0 0 1.5px var(--bg)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:600;background:var(--ink);color:var(--bg);transition:transform .15s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.ribbon{background:var(--ribbon);color:var(--ribbon-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--err);color:var(--on-err)}
.policy{max-width:760px;margin:40px auto 64px;display:grid;gap:18px}
.policy-eb{color:var(--ribbon);margin:0}
.policy h1{font-family:var(--display);font-size:clamp(32px,5vw,48px);font-weight:500;line-height:1.1}
.policy-intro{font-size:17px;color:var(--muted);margin:0;max-width:60ch}
.policy-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:12px}
.policy-list li{display:grid;grid-template-columns:auto 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.policy-n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ribbon);color:var(--ribbon-ink);font-weight:700;font-size:14px}
.policy-list h2{font-size:17px;font-family:var(--body);font-weight:700;margin:4px 0 6px}
.policy-list p{margin:0 0 8px;color:var(--muted);line-height:1.7}.policy-list p:last-child{margin-bottom:0}
.policy-contact{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.policy-outro{font-family:var(--display);font-size:20px;margin:6px 0 0}
.policy > .btn{justify-self:start}
@media (max-width:560px){.policy{margin-top:24px}.policy-list li{padding:16px;gap:12px}}
.urg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--ribbon) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--ribbon) 35%,transparent);margin-bottom:14px}
.urg svg{color:var(--ribbon);flex:none;margin-top:1px}.urg div{display:grid;gap:2px;font-size:13.5px}.urg b{color:var(--ink)}.urg span{color:var(--muted)}
.low-left{margin-top:6px;font-size:12.5px;font-weight:600;color:var(--ribbon)}
.bag-remind{position:fixed;z-index:24;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));background:var(--head);color:var(--head-ink);border:1px solid var(--head-line);border-radius:16px;box-shadow:0 18px 40px -14px rgba(0,0,0,.55);animation:remIn .35s ease}
.rem-in{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px}
[dir="rtl"] .rem-in{padding:10px 14px 10px 10px}
.rem-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--bar-pink);color:#1a0b11;flex:none}
.rem-txt{display:grid;gap:1px;min-width:0;flex:1}.rem-txt b{font-size:14px}.rem-txt > span{font-size:12.5px;color:var(--bar-pink)}
.bag-remind .btn{flex:none}
.bag-remind.pulse{animation:remPulse .9s ease 2}
@keyframes remIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes remPulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bar-pink) 45%,transparent)}}
@media (prefers-reduced-motion:reduce){.bag-remind,.bag-remind.pulse{animation:none}}
body.locked .bag-remind{display:none}
body.has-remind .wa-fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body.has-remind footer{padding-bottom:90px}
body.has-remind .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (max-width:480px){.rem-txt > span{display:none}.rem-in{gap:10px}}
.btn.wa{background:#1FA855;color:#fff;text-decoration:none}.btn.wa:hover{background:#1a9a4d}.btn.wa svg{width:20px;height:20px}
.wa-track{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}.wa-track .sub{max-width:40ch}
.oc-wa{display:flex;padding-top:4px;border-top:1px solid var(--line)}.oc-wa .btn{margin-top:10px}
@media (max-width:560px){.wa-track .btn,.oc-wa .btn{width:100%;white-space:normal}}
.btn.sm{padding:7px 14px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;flex:none}
.icon-btn:hover{background:var(--panel)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* header */
.announce{background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--head-line);text-align:center;font-size:12.5px;padding-block:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head);color:var(--head-ink);border-bottom:1px solid var(--head-line);box-shadow:0 6px 20px -14px rgba(120,20,60,.45)}
.top-in{display:flex;align-items:center;gap:18px;height:68px}
.logo{font-family:var(--display);font-size:28px;font-weight:600;text-decoration:none;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0}
.logo span{font-style:italic;color:var(--ribbon)}
.logo svg{width:26px;height:26px}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow:visible}
.nav button{border:0;background:none;padding:8px 9px;font-size:14px;color:var(--muted);white-space:nowrap}
.nav button:hover,.nav button[aria-current="true"]{color:var(--ink)}
.nav button[aria-current="true"]{box-shadow:inset 0 -2px 0 var(--ribbon)}
.top-actions{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:0 14px;height:40px;width:210px}
.search input{border:0;background:none;outline:none;width:100%;min-width:0}
.top .search{flex:0 1 210px;width:auto;min-width:120px}
@media (max-width:1300px){.top-actions:has(#adminBtn:not([hidden])) .search{display:none}}
.pill-btn{display:flex;align-items:center;gap:7px;border:0;background:var(--panel);color:var(--ink);border-radius:999px;height:40px;padding:0 14px;font-weight:600;font-size:14px;white-space:nowrap}
.pill-btn[aria-current="true"]{background:var(--ink);color:var(--bg)}
.bag-btn{background:var(--ink);color:var(--bg)}
.bag-count{min-width:20px;height:20px;border-radius:10px;background:var(--ribbon);color:var(--ribbon-ink);font-size:12px;display:grid;place-items:center;padding-inline:5px}
.bag-btn.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.08)}}

/* pink header */
.top .logo{color:var(--head-ink)}
.top .logo span{color:var(--bar-pink)}
.top .logo svg rect:not([fill^="var"]),.top .logo svg path:not([fill^="var"]){fill:var(--head-ink)}
.top .nav button{color:var(--head-soft)}
.top .nav button:hover,.top .nav button[aria-current="true"]{color:var(--head-ink)}
.top .nav button[aria-current="true"]{box-shadow:inset 0 -2px 0 var(--head-ink)}
.top .search{background:var(--head-field)}
.top .search input::placeholder{color:var(--head-soft)}
.top .search,.top .search input{color:var(--head-ink)}
.top .pill-btn{background:var(--head-field);color:var(--head-ink)}
.top .pill-btn[aria-current="true"],.top .bag-btn{background:var(--head-ink);color:var(--head)}
.top .bag-count{background:var(--head-ink);color:var(--head)}
.top .icon-btn{color:var(--head-ink)}
.top .icon-btn:hover{background:var(--head-field)}
.announce,.announce span,.announce b{color:var(--bar-pink)}
.announce .pink{font-weight:600}
.menu-btn{display:none}
@media (max-width:1100px){.nav{display:none}.menu-btn{display:inline-grid}}
@media (max-width:760px){.search{display:none}.top-in{gap:8px}.pill-btn .lbl{display:none}.pill-btn{padding:0 11px}.logo{font-size:24px}.mobile-search{display:flex!important}.announce span:not(:first-child){display:none}}
.mobile-search{display:none;margin-top:12px;width:100%;height:44px}
.announce .wrap{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}

/* hero film */
.reel-wrap{padding-block:20px 8px}
.reel{position:relative;background:var(--stage);color:var(--stage-ink);border-radius:22px;overflow:hidden;height:clamp(480px,58vw,580px);isolation:isolate}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.reel .vshade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(10,8,14,.75),rgba(10,8,14,.15) 70%)}
.scene{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;padding:56px clamp(24px,5vw,72px) 92px;opacity:0;transition:opacity .9s ease;pointer-events:none;z-index:2}
.scene.active{opacity:1;pointer-events:auto}
.scene .glow{position:absolute;inset:-20%;z-index:-1;background:radial-gradient(40% 50% at 72% 50%,var(--hue) 0%,transparent 70%),radial-gradient(30% 40% at 15% 90%,color-mix(in srgb,var(--hue) 40%,transparent),transparent 70%);opacity:.75;transform:scale(1.1);transition:transform 6s ease}
.scene.active .glow{transform:scale(1)}
.scene-copy{position:relative;z-index:2;min-width:0}
.scene-copy > *{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.scene.active .scene-copy > *{opacity:1;transform:none}
.scene.active .scene-copy > *:nth-child(2){transition-delay:.12s}
.scene.active .scene-copy > *:nth-child(3){transition-delay:.24s}
.scene.active .scene-copy > *:nth-child(4){transition-delay:.36s}
.scene .eyebrow{color:color-mix(in srgb,var(--stage-ink) 70%,transparent);margin:0 0 18px}
.scene h1,.scene h2{font-family:var(--display);font-weight:500;font-size:clamp(44px,7vw,90px);line-height:.95;letter-spacing:-.02em}
.scene h1 em,.scene h2 em{font-style:italic;color:var(--hue-ink)}
.scene p.sub{max-width:38ch;margin:20px 0 26px;color:color-mix(in srgb,var(--stage-ink) 80%,transparent);font-size:16.5px}
.scene .btn{background:var(--stage-ink);color:var(--stage)}
.scene-art{position:relative;z-index:1;display:grid;place-items:center;height:100%;min-width:0}
.scene-art svg{width:min(100%,430px);height:auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45));transform:scale(1.1) rotate(-6deg);opacity:0;transition:transform 1.4s cubic-bezier(.2,.7,.2,1),opacity 1s}
.scene.active .scene-art svg{transform:scale(1) rotate(0);opacity:1;animation:float 5s ease-in-out 1.2s infinite}
@keyframes float{50%{translate:0 -10px}}
.reel-ui{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:16px;padding:18px clamp(24px,5vw,72px) 22px;background:linear-gradient(transparent,rgba(0,0,0,.35))}
.bars{display:flex;gap:6px;flex:1}
.bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden;border:0;padding:0;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:var(--stage-ink)}
.bar.done i{width:100%}
.bar.run i{animation:fill 5.5s linear forwards}
.reel[data-paused] .bar.run i{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.reel-ui .icon-btn{color:var(--stage-ink);background:rgba(255,255,255,.14);width:38px;height:38px}
.reel-ui .icon-btn:hover{background:rgba(255,255,255,.24)}
.timecode{color:rgba(255,255,255,.72);min-width:74px;text-align:right}
.rec{display:inline-flex;align-items:center;gap:6px}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff4d6d;animation:blink 1.6s infinite}
.reel[data-paused] .rec::before{animation:none;opacity:.4}
@keyframes blink{50%{opacity:.25}}
@media (max-width:760px){
  .reel{height:580px}
  .scene{grid-template-columns:1fr;align-items:end;padding:28px 22px 86px}
  .scene-art{position:absolute;inset:0 0 42% 0;height:auto}
  .scene-art svg{width:min(76%,300px)}
  .scene h1,.scene h2{font-size:clamp(40px,12vw,56px)}
  .scene p.sub{margin:14px 0 18px;font-size:15px}
  .timecode{display:none}
  .reel .vshade{background:linear-gradient(0deg,rgba(10,8,14,.85),rgba(10,8,14,.1) 75%)}
}

/* sections */
section.block{padding-block:52px 8px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2{font-family:var(--display);font-weight:500;font-size:clamp(30px,4vw,44px);letter-spacing:-.015em;line-height:1.05}
.sec-head h2 em{font-style:italic;color:var(--ribbon)}
.sec-head p{margin:6px 0 0;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cat{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px;text-align:start;border:0;background:var(--panel);border-radius:var(--r);padding:18px;min-height:146px;overflow:hidden;transition:transform .25s,background .25s;color:var(--ink)}
.cat:hover{transform:translateY(-3px)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cat[aria-pressed="true"] .cat-n{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.cat-name{font-family:var(--display);font-size:22px;font-weight:500;line-height:1.1}
.cat-n{font-size:12.5px;color:var(--muted);margin-top:2px}
.cat svg.art{position:absolute;right:-6px;top:-4px;width:108px;height:108px;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.cat:hover svg.art{transform:rotate(-8deg) scale(1.06)}
.cat .arrow{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink)}
.cat[aria-pressed="true"] .arrow{background:var(--ribbon);color:var(--ribbon-ink)}
@media (max-width:760px){.cats{grid-template-columns:repeat(2,1fr);gap:10px}.cat{min-height:120px;padding:14px}.cat svg.art{width:84px;height:84px}.cat-name{font-size:19px}}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:600;margin-left:4px;opacity:.7}
select.sort{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 18px;margin-top:20px}
@media (max-width:1020px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}}
.card{position:relative;display:flex;flex-direction:column;gap:12px;animation:rise .5s both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}}
.card-art{position:relative;border:0;padding:0;border-radius:var(--r);background:var(--panel);aspect-ratio:4/5;max-width:100%;width:100%;display:grid;place-items:center;overflow:hidden}
.card-art svg{width:82%;height:auto;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .card-art svg{transform:scale(1.06) rotate(-3deg)}
.card:hover .card-art img{transform:scale(1.04)}
.badge{position:absolute;left:10px;top:10px;z-index:2;background:var(--surface);color:var(--ink);font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.badge.sale{background:var(--ribbon);color:var(--ribbon-ink)}
.badge.out{background:var(--ink);color:var(--bg)}
.card-body{display:grid;gap:3px;min-width:0}
.card-cat{color:var(--muted);font-size:12px;margin:0}
.card h3{font-size:15.5px;font-weight:600;line-height:1.3}
.card h3 button{border:0;background:none;padding:0;text-align:start;color:var(--ink)}
.price{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-weight:600}
.card-foot > div{min-width:0}
.price s{color:var(--muted);font-weight:400;font-size:13px}
.price .sale{color:var(--ribbon)}
.dots{display:flex;gap:5px;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.add-mini{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.add-mini:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted);background:var(--panel);border-radius:var(--r);display:grid;gap:12px;justify-items:center}
.skel{background:var(--panel);border-radius:var(--r);aspect-ratio:4/5;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

.services{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin-top:64px}
.svc{padding:24px 20px;display:grid;gap:6px;border-right:1px solid var(--line)}
.svc:last-child{border-right:0}
.svc b{font-family:var(--display);font-size:19px;font-weight:500}
.svc span{color:var(--muted);font-size:14px}
.svc svg{color:var(--ribbon);width:24px;height:24px}
@media (max-width:860px){.services{grid-template-columns:1fr 1fr}.svc:nth-child(2){border-right:0}.svc:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:480px){.services{grid-template-columns:1fr}.svc{border-right:0;border-bottom:1px solid var(--line)}.svc:last-child{border-bottom:0}}
footer{padding-block:48px 40px;color:var(--muted);font-size:13.5px}
.foot{display:grid;grid-template-columns:1.6fr 2fr 1fr 1fr;gap:28px}
.foot-cats{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.foot h4{margin:0 0 10px;color:var(--ink);font-size:13px}
.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.foot ul .link{color:inherit;text-decoration:none;font:inherit;line-height:inherit;text-align:start}.foot ul .link:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.logo-wm{padding:0;line-height:0}
.logo-wm img{height:60px;width:auto;display:block}

.foot-emblem{width:104px;height:104px;margin-bottom:12px}
@media (max-width:760px){.logo-wm img{height:42px}}
@media (max-width:400px){.logo-wm img{height:36px}}
@media (max-width:480px){.top-actions:has(#adminBtn:not([hidden])) #themeBtn{display:none}.top-actions:has(#adminBtn:not([hidden])){gap:5px}}
@media (max-width:374px){.logo-wm img{height:32px}.top #themeBtn{display:none}.top .pill-btn{padding:0 8px}}
.wa-link{display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:600}
.wa-link svg{color:#1FA855;width:22px;height:22px}
.wa-txt{display:grid;line-height:1.3;min-width:0}.mail-link svg{color:var(--ribbon)!important}.tg-link svg{color:#2AABEE!important}@media (max-width:760px){.foot > div:last-child{grid-column:1/-1}}.wa-txt bdi{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500;color:var(--muted)}
.wa-link:hover .wa-txt{text-decoration:underline;text-underline-offset:3px}
.wa-fab{position:fixed;z-index:25;inset-inline-end:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 18px 0 14px;border-radius:999px;background:#1FA855;color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;box-shadow:0 10px 28px -10px rgba(0,0,0,.45);transition:transform .15s}
.wa-fab:hover{transform:translateY(-2px)}
.wa-fab svg{width:24px;height:24px}
body.locked .wa-fab{display:none}
@media (max-width:760px){.wa-fab{width:52px;padding:0;justify-content:center}.wa-fab .lbl{display:none}}
.foot .logo{font-size:24px;margin-bottom:8px}
.paylogos{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.paylogos span{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-family:var(--mono);font-size:11px;color:var(--ink)}
@media (max-width:760px){.foot{grid-template-columns:1fr 1fr}.foot > div:first-child{grid-column:1/-1}}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(440px,100%);background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.drawer.wide{width:min(560px,100%)}
.drawer.show{transform:none;visibility:visible}
.drawer.left{left:0;right:auto;transform:translateX(-100%)}
.drawer.left.show{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.d-head h3{font-family:var(--display);font-weight:500;font-size:24px}
.d-body{flex:1;overflow-y:auto;padding:16px 20px;display:grid;align-content:start;gap:14px}
.d-foot{padding:16px 20px 20px;border-top:1px solid var(--line);display:grid;gap:12px;background:var(--surface)}
.ship-meter{display:grid;gap:6px;font-size:13px}
.meter{height:5px;border-radius:3px;background:var(--panel);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ribbon);transition:width .4s}
.line-item{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:start}
.li-art{width:76px;height:88px;border-radius:10px;background:var(--panel);display:grid;place-items:center;overflow:hidden;position:relative}
.li-art svg{width:86%}
.li-art img{width:100%;height:100%;object-fit:cover}
.li-name{font-weight:600;line-height:1.3}
.li-meta{color:var(--muted);font-size:13px}
.li-right{display:grid;justify-items:end;gap:8px}
.remove{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;height:36px;background:var(--surface)}
.stepper button{border:0;background:none;width:34px;height:100%;font-size:17px;color:var(--ink)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:24px;text-align:center;font-weight:600}
.stepper.lg{height:48px}.stepper.lg button{width:44px}
.giftwrap{display:grid;gap:8px;background:var(--panel);border-radius:12px;padding:14px}
.giftwrap label{display:flex;gap:10px;align-items:center;font-weight:500}
.giftwrap textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;resize:vertical;min-height:64px}
.sum-row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.sum-row.total{font-size:17px;font-weight:700}
.sum-row .muted{color:var(--muted)}
.sum-row.disc{color:var(--ok)}
.bag-empty{text-align:center;color:var(--muted);padding:40px 10px;display:grid;gap:14px;justify-items:center}
.bag-empty svg{width:120px}
.mnav{display:grid;gap:4px}
.mnav button{border:0;background:none;text-align:start;padding:12px 4px;font-family:var(--display);font-size:24px;border-bottom:1px solid var(--line);color:var(--ink)}

.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;pointer-events:none}
.modal .sheet{pointer-events:auto;background:var(--bg);border-radius:22px;width:min(980px,100%);max-height:calc(100vh - 48px);overflow:auto;position:relative;opacity:0;transform:translateY(20px) scale(.98);transition:opacity .3s,transform .35s cubic-bezier(.2,.7,.2,1)}
.modal.show .sheet{opacity:1;transform:none}
.modal .close{position:absolute;right:14px;top:14px;z-index:3;background:var(--surface)}
.pdp{display:grid;grid-template-columns:1.05fr 1fr}
.pdp-media{background:var(--panel);display:grid;grid-template-rows:1fr auto;gap:12px;padding:20px;min-height:460px;position:relative}
.pdp-main{display:grid;place-items:center;border-radius:14px;overflow:hidden;position:relative;min-height:0}
.pdp-main svg{width:min(100%,400px)}
.pdp-main img{width:100%;height:100%;max-height:560px;object-fit:cover;border-radius:14px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumb{width:62px;height:72px;flex:none;border-radius:10px;border:2px solid transparent;padding:0;overflow:hidden;background:var(--surface)}
.thumb[aria-pressed="true"]{border-color:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.pdp-info{padding:36px 32px 32px;display:grid;gap:18px;align-content:start;min-width:0}
.pdp-info h2{font-family:var(--display);font-weight:500;font-size:clamp(28px,3.4vw,40px);line-height:1.05;letter-spacing:-.01em}
.pdp-price{font-size:22px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pdp-desc{color:var(--muted);margin:0;white-space:pre-line}
.opt-label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:8px}
.opt-label span{color:var(--muted);font-weight:400}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);outline-offset:3px}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink)}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{min-width:48px;height:42px;padding-inline:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:13px;color:var(--ink)}
.size[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.size:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.hint{font-size:13px;margin-top:6px}
.hint.err{color:var(--err)} .hint.warn{color:var(--warn)}
.buy-row{display:flex;gap:10px;flex-wrap:wrap}
.buy-row .btn{flex:1;min-width:150px;height:48px}
.specs{display:grid;border-top:1px solid var(--line);font-size:14px;margin:0}
.specs div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.specs dt{color:var(--muted)}.specs dd{margin:0;text-align:right}
.assure{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}

.auth-foot svg{width:16px;height:16px;margin-top:2px}
.pw-in{display:flex;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;transition:border-color .2s}
.pw-in:focus-within{border-color:var(--ink)}
.field .pw-in input{border:0!important;border-radius:0!important}
.pw-in button{border:0;background:none;padding:0 14px;font-size:13px;color:var(--muted);font-weight:600}
.who-card{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:13.5px;min-width:0}
.who-card b{display:block;overflow-wrap:anywhere;line-height:1.3}
.who-acts{display:flex;gap:14px;font-size:13px}
.perm-list{display:grid;border-top:1px solid var(--line)}
.perm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg label{position:relative;padding:7px 12px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg label + label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--ribbon);outline-offset:-2px}
.perm-chips{display:flex;flex-wrap:wrap;gap:4px}
.pchip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel);white-space:nowrap}
.pchip.e{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.invite-code{font-family:var(--mono);font-size:clamp(20px,6vw,28px);letter-spacing:.12em;padding:18px;border-radius:14px;background:var(--panel);text-align:center;font-weight:500;user-select:all;color:var(--ink)}
.steps{margin:0;padding-inline-start:20px;display:grid;gap:8px;font-size:14px}
.steps + .note{margin-top:12px}
.ro-note{display:flex;gap:10px;align-items:center}
@media (max-width:900px){.who-card{grid-template-columns:minmax(0,1fr) auto;align-items:center}.perm-row{grid-template-columns:1fr}}

/* CliQ receipts */
.file-hide{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.rc-up{position:relative;display:flex;gap:14px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:18px;background:var(--surface);cursor:pointer;color:var(--ink);font-size:14px}
.rc-up:hover,.rc-up:focus-within{border-color:var(--ink)}
.rc-up svg{width:26px;height:26px;color:var(--ribbon)}
.rc-busy{cursor:default;color:var(--muted)}
.field.bad .rc-up{border-color:var(--err)}
.rc-prev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.rc-prev img{width:96px;height:120px;object-fit:cover;border-radius:8px;background:var(--panel)}
.rc-prev .link{font-size:13.5px}
.rc-grid{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px}
.rc-shot{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);padding:0;aspect-ratio:3/4;max-width:100%;display:grid;place-items:center}
.rc-shot img{width:100%;height:100%;object-fit:cover;object-position:top}
.rc-shot .tag{position:absolute;left:8px;bottom:8px;background:var(--surface)}
.empty-shot{font-size:13px;color:var(--muted);text-align:center;padding:12px;gap:6px;display:flex;align-items:center;justify-content:center}
.pay-review.is-open{border-color:color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 35%,transparent)}
.pay-fix{display:grid;gap:10px;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--err) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--err) 30%,transparent);font-size:14px}
.pay-fix .rc-wait{display:none;align-items:center;gap:8px}
.pay-fix.busy .rc-wait{display:flex}
.pay-fix.busy label{display:none}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(10,8,14,.88);display:grid;place-items:center;padding:24px}
.lightbox img{max-width:100%;max-height:calc(100vh - 48px);border-radius:10px;background:#fff}
.lightbox button{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;background:rgba(255,255,255,.14);color:#fff}
#ordersBtn{position:relative}
@media (max-width:560px){.rc-grid{grid-template-columns:1fr}.rc-shot{max-width:220px}}

/* ===== sections, filters, language ===== */
.lang-btn{font-family:"IBM Plex Sans Arabic","Figtree",sans-serif;font-weight:600}
.lang-btn .lshort{display:none}
@media (max-width:760px){.lang-btn .lfull{display:none}.lang-btn .lshort{display:inline}.top .pill-btn{padding:0 10px}.top-in{gap:6px}.logo{font-size:22px}.logo svg{width:22px;height:22px}}
.nav-item{position:relative;display:flex}
.nav-item > button{display:inline-flex;align-items:center;gap:4px}
.nav .chev{width:14px;height:14px;opacity:.7}
.dd{position:absolute;top:100%;inset-inline-start:0;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:none;gap:2px;box-shadow:0 22px 44px -22px rgba(0,0,0,.5);z-index:45}
.nav-item:hover .dd,.nav-item:focus-within .dd{display:grid}
.top .nav .dd button{color:var(--ink);text-align:start;padding:9px 12px;border-radius:8px;font-size:14px;box-shadow:none}
.top .nav .dd button:hover{background:var(--panel);color:var(--ink)}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sect{position:relative;overflow:hidden;border-radius:22px;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;gap:18px 12px;min-height:0}
.sect-top{grid-column:1;grid-row:1;min-width:0}
.sect-cats{grid-column:1/-1;grid-row:2}
.sect-cta{grid-column:1/-1;grid-row:3}
.sect.women{background:var(--sw-bg);color:var(--sw-ink)}
.sect.men{background:var(--sm-bg);color:var(--sm-ink)}
.sec-sw{display:block;width:28px;height:28px;border-radius:8px}.sec-sw.women{background:var(--sw-bg);box-shadow:inset 0 0 0 1px var(--sw-line)}.sec-sw.men{background:var(--sm-bg)}
.sec-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.sec-form h4{margin:0 0 10px;font-size:14px}
.sections{grid-auto-rows:1fr}
.sect .eyebrow{margin:0 0 8px;opacity:.7}
.sect h3{font-family:var(--display);font-weight:500;font-size:clamp(42px,5.5vw,68px);line-height:1;letter-spacing:-.02em}
.sect h3 button{border:0;background:none;color:inherit;font:inherit;padding:0;text-align:start}
.sect .cnt{margin:10px 0 0;opacity:.75;font-size:14px}
.sect-art{grid-column:2;grid-row:1;width:clamp(150px,18vw,230px);display:grid;grid-template-columns:1fr 1fr;align-items:end;pointer-events:none;margin-top:-8px;margin-inline-end:-8px}
.sect-art svg{width:100%;height:auto;filter:drop-shadow(0 18px 20px rgba(0,0,0,.18))}
.sect-art svg:first-child{grid-column:1/-1;width:74%;justify-self:center}
.sect-cats{display:flex;flex-wrap:wrap;gap:8px;align-self:end;max-width:100%}
.sect-cats button{border:1px solid var(--sw-line);background:color-mix(in srgb,currentColor 6%,transparent);color:inherit;border-radius:999px;padding:7px 13px;font-size:13.5px;transition:background .2s}
.sect.men .sect-cats button{border-color:var(--sm-line)}
.sect-cats button:hover{background:color-mix(in srgb,currentColor 16%,transparent)}
.sect-cta{justify-self:start}
.sect.women .sect-cta{background:var(--sw-ink);color:var(--sw-bg)}
.sect.men .sect-cta{background:var(--sm-ink);color:var(--sm-bg)}
@media (max-width:760px){.sections{grid-template-columns:1fr}.sect{min-height:0;padding:22px}.sect-art{width:112px}.sect-art svg:not(:first-child){display:none}.sect-art svg:first-child{width:100%}.sect h3{font-size:40px}}
.shop-bar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.shop-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.segb{display:inline-flex;background:var(--panel);border-radius:999px;padding:4px;gap:2px}
.segb button{border:0;background:none;border-radius:999px;padding:8px 18px;font-weight:600;font-size:14px;color:var(--muted)}
.segb button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.f-btn{height:38px;border:1.5px solid var(--line);background:var(--surface)}
.f-btn[aria-expanded="true"]{border-color:var(--ink)}
.fpanel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,.8fr);gap:20px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-top:14px}
.fgroup{display:grid;gap:10px;align-content:start;min-width:0}
.fgroup h4{font-size:12.5px;color:var(--muted);font-weight:600;margin:0}
.price-in{display:flex;gap:8px}
.price-in input{width:100%;min-width:0;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface)}
.price-in input:focus{border-color:var(--ink);outline:none}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-width:40px;padding:5px 9px;font-size:13px;font-family:var(--mono)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fswatch{width:28px;height:28px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.fswatch[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.active-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.afchip{display:inline-flex;gap:6px;align-items:center;background:var(--panel);color:var(--ink);border:0;border-radius:999px;padding:5px 10px;font-size:13px}
.afchip svg{width:14px;height:14px}
.chips .chip b{font-size:11.5px;opacity:.6;margin-inline-start:2px}
@media (max-width:900px){.fpanel{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.fpanel{grid-template-columns:1fr}.shop-bar{align-items:stretch}.segb{width:100%}.segb button{flex:1}.shop-tools{width:100%}.shop-tools > *{flex:1}}
.mnav .m-sec{display:grid;padding-block:4px 10px;border-bottom:1px solid var(--line)}
.mnav .m-head{font-size:26px;border-bottom:0!important}
.mnav .m-cat{font-family:var(--body)!important;font-size:15px!important;padding:8px 4px!important;border-bottom:0!important;color:var(--muted)!important}
.mnav .m-lang{font-family:"IBM Plex Sans Arabic","Figtree",sans-serif!important;font-size:16px!important;color:var(--ribbon)!important}
.btn.ghost-light{background:transparent;color:var(--stage-ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:760px){.foot-cats{grid-column:1/-1}}
/* Arabic typography */
:lang(ar) body{line-height:1.75}
:lang(ar) .mono{font-family:var(--body);letter-spacing:0;text-transform:none}
:lang(ar) .scene h1,:lang(ar) .scene h2{font-size:clamp(40px,6vw,78px);line-height:1.2;letter-spacing:0}
:lang(ar) .sec-head h2,:lang(ar) .co-title,:lang(ar) .pdp-info h2,:lang(ar) .done-view h2,:lang(ar) .cf-hero h1{letter-spacing:0;line-height:1.3}
:lang(ar) .sect h3{letter-spacing:0;line-height:1.25}
:lang(ar) .tag{letter-spacing:0}
/* right-to-left mirroring */
[dir="rtl"] svg.flip{transform:scaleX(-1)}
[dir="rtl"] .badge{left:auto;right:10px}
[dir="rtl"] .modal .close{right:auto;left:14px}
[dir="rtl"] .card-num .brand{right:auto;left:10px}
[dir="rtl"] .li-art .qty-badge{right:auto;left:-2px}
[dir="rtl"] .tk::before{left:50%;right:-50%}
[dir="rtl"] .drawer{right:auto;left:0;transform:translateX(-100%)}
[dir="rtl"] .drawer.show{transform:none}
[dir="rtl"] .drawer.left{left:auto;right:0;transform:translateX(100%)}
[dir="rtl"] .drawer.left.show{transform:none}
[dir="rtl"] .reel .vshade{background:linear-gradient(270deg,rgba(10,8,14,.75),rgba(10,8,14,.15) 70%)}
[dir="rtl"] .phone-in{direction:ltr}
[dir="rtl"] .phone-in input{text-align:left}
[dir="rtl"] .promo-row input,[dir="rtl"] #ccNum,[dir="rtl"] #ccExp,[dir="rtl"] #ccCvc,[dir="rtl"] .price-in input{direction:ltr;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 20px;font-weight:500;font-size:14px;transition:all .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--err);color:var(--on-err)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.inv-ask{display:grid;grid-template-columns:minmax(0,1fr);box-sizing:border-box;width:100%;min-width:0;gap:6px;margin-top:4px;padding:14px 16px;border:1px dashed var(--line);border-radius:14px;max-width:460px;background:var(--surface,transparent)}
.inv-ask .sub{font-size:13px}
.inv-row{display:flex;gap:8px;min-width:0}.inv-row input{flex:1 1 0;min-width:0;width:auto}.inv-row .btn{flex:none}
.inv-ask .msg{color:var(--err,#c0392b);font-size:13px}.inv-ask .msg:empty{display:none}

const SEC_DEFAULTS = [{id:"women", name:"Women", nameAr:"النساء", order:1, active:true, theme:"women"}, {id:"men", name:"Men", nameAr:"الرجال", order:2, active:true, theme:"men"}];
let SECS = ["women", "men"];
const allSections = () => { const m = new Map(SEC_DEFAULTS.map(x => [x.id, {...x}])); (S.sections || []).forEach(x => m.set(x.id, {...(m.get(x.id) || {}), ...x})); return [...m.values()].filter(x => !x.deleted).sort((a,b) => (a.order ?? 99) - (b.order ?? 99)); };
const secById = id => allSections().find(x => x.id === id);
const secIds = () => allSections().map(x => x.id);
function refreshSecs() { SECS = allSections().filter(x => x.active !== false).map(x => x.id); }
const secTheme = (id, i = 0) => { const x = secById(id) || {}; return x.theme === "men" || x.theme === "women" ? x.theme : (i % 2 ? "men" : "women"); };
const isStockSec = x => { const d = SEC_DEFAULTS.find(y => y.id === x.id); return !!d && x.name === d.name && (x.nameAr || "") === d.nameAr; };
function secTxt(id, kind) {
  const x = secById(id); if (!x) return "";
  if (isStockSec(x)) { const w = id === "women"; return t({label: id, title: w ? "secWomen" : "secMen", shop: w ? "shopWomen" : "shopMen", all: w ? "allWomen" : "allMen"}[kind]); }
  const n = tr(x, "name") || x.name;
  return isAr() ? {label: n, title: "قسم " + n, shop: "تسوّق قسم " + n, all: "كل منتجات " + n}[kind] : {label: n, title: n, shop: "Shop " + n, all: "All " + n}[kind];
}

// ---- product helpers ----
const byId = id => S.products.find(p => p.id === id);
const catById = id => S.cats.find(c => c.id === id);
const catName = id => { const c = catById(id); return c ? tr(c, "name") : (id === "all" ? t("all") : "—"); };
const secName = s => secById(s) ? secTxt(s, "title") : t("allPieces");
const catLabel = id => { const c = catById(id); return c ? `${(secById(c.section) || {}).name || "No section"} · ${c.name}` : "Uncategorised"; };
const secOf = p => (catById(p.cat) || {}).section || "";
const pName = p => tr(p, "name");
const pDesc = p => tr(p, "desc");
const priceOf = p => (+p.salePrice > 0 && +p.salePrice < +p.price) ? +p.salePrice : +p.price;
const onSale = p => +p.salePrice > 0 && +p.salePrice < +p.price;
const sizesOf = p => Array.isArray(p.sizes) && p.sizes.length ? p.sizes.map(String) : ["One size"];
const colorsOf = p => Array.isArray(p.colors) && p.colors.length ? p.colors : [{name:"Default", hex:"#9A93A6"}];
const colorName = c => tr(c, "name");
const stockOf = (p, size) => { const s = p.stock || {}; return Math.max(0, Math.floor(+s[size] || 0)); };
const totalStock = p => sizesOf(p).reduce((a, s) => a + stockOf(p, s), 0);
const imagesOf = p => (Array.isArray(p.images) ? p.images : []).filter(assetOk);
const catsOf = sec => S.cats.filter(c => c.active !== false && c.section === sec).sort((a,b) => (a.order ?? 99) - (b.order ?? 99));
const visibleCats = () => SECS.flatMap(catsOf);
const visibleProducts = () => S.products.filter(p => { const c = catById(p.cat); return p.active !== false && c && c.active !== false && SECS.includes(c.section); });
function mediaHtml(p, colorIdx=0, imgIdx=0, cls="") {
  const imgs = imagesOf(p);
  if (imgs.length) return `<img src="${imgUrl(imgs[Math.min(imgIdx, imgs.length-1)])}" alt="${esc(pName(p))}" loading="lazy" class="${cls}">`;
  const c = colorsOf(p)[colorIdx] || colorsOf(p)[0];
  return svg(p.art || "giftbox", c.hex);
}

async function compressReceipt(file) {

    const W = img.naturalWidth, H = img.naturalHeight;
    if (!W || !H) throw {code:"decode"};
    for (const max of [1600, 1280, 1000, 800]) {

      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      for (const q of [0.82, 0.7, 0.58]) { const d = c.toDataURL("image/jpeg", q); if (d.length <= 230000) return {img: d, w, h, bytes: Math.round(d.length * 0.75), fileName: String(file.name || "receipt").slice(0, 80)}; }
    }

  } finally { URL.revokeObjectURL(url); }
}

async function payDecision(approve) {
  const o = allOrders().find(x => x.id === PANEL.id && x.uid === PANEL.uid); if (!o) return;
  const cur = statusOf(o);
  if (cur.status !== "verify") { toast("This payment was already reviewed", true); renderOrderPanel(); return; }
  const reason = approve ? "" : (($("#payReason") || {}).value || "").trim().slice(0, 200);
  if (!approve && reason.length < 3) { toast("Add a reason so the customer knows what to fix", true); const t = $("#payReason"); if (t) t.focus(); return; }
  const now = Date.now();
  let stockApplied = !!(S.statuses[o.id] || {}).stockApplied;
  busy = true;
  const ok = await dbw(async () => {
    if (approve && !stockApplied) { await adjustStock(o.items, -1); stockApplied = true; }
    const history = [...(cur.history || [{status:"verify", at:o.at}])];
    history.push(approve ? {status:"confirmed", at:now, note:"Payment approved"} : {status:"rejected", at:now, note:reason});
    await S.db.doc("status/" + o.id).set({status: approve ? "confirmed" : "rejected", pay: approve ? "approved" : "rejected", payReason: reason, payAt: now, tracking: cur.tracking || "", history: history.slice(-30), stockApplied, at: now});
  }, approve ? `Approved CliQ payment for ${o.id} (${fmtC(o.total, o.currency)}) and confirmed the order` : `Rejected CliQ payment for ${o.id}: ${reason}`);
  busy = false;
  if (ok) { PANEL.rejecting = false; PANEL.reason = ""; renderOrderPanel(); }
}

async function saveStatus(to) {
  const o = allOrders().find(x => x.id === PANEL.id && x.uid === PANEL.uid); if (!o) return;
  const cur = statusOf(o);
  const status = to || $("#pStatus").value, tracking = $("#pTrack").value.trim().slice(0,60), note = $("#pNote").value.trim().slice(0,140);
  if (status === cur.status && tracking === (cur.tracking||"") && !note) { toast("Nothing changed"); return; }
  busy = true;
  let stockApplied = !!cur.stockApplied;
  const needsStock = ["confirmed","shipped","out","delivered"].includes(status);
  const ok = await dbw(async () => {
    if (needsStock && !stockApplied) { await adjustStock(o.items, -1); stockApplied = true; }
    if (status === "cancelled" && stockApplied) { await adjustStock(o.items, +1); stockApplied = false; }
    const history = [...(cur.history || [{status:"pending", at:o.at}])];
    if (status !== cur.status || note) history.push({status, at: Date.now(), note});
    await S.db.doc("status/" + o.id).set({status, tracking, history: history.slice(-30), stockApplied, at: Date.now()});

}
async function adjustStock(items, dir) {
  const agg = {};
  items.forEach(it => { agg[it.pid] = agg[it.pid] || {}; agg[it.pid][it.size] = (agg[it.pid][it.size]||0) + it.qty; });
  for (const pid of Object.keys(agg)) {
    const p = byId(pid); if (!p) continue;
    const patch = {};
    Object.entries(agg[pid]).forEach(([size, q]) => { patch[size] = Math.max(0, stockOf(p, size) + dir*q); });
    await S.db.doc("products/" + pid).update({stock: patch});
  }
}

async function uploadImages(files) {
  if (!S.assets || !ED) return;
  const list = [...files].filter(f => /^image\//.test(f.type));
  if (!list.length) return;
  for (const f of list) {
    if (f.size > 20*1024*1024) { toast(`${f.name} is over 20 MB`, true); continue; }
    ED.uploading++; renderEditorKeep();
    try { const r = await S.assets.upload(f); if (ED) ED.images.push(r.id); }
    catch (e) { toast(e && e.code === "quota_exceeded" ? "Photo storage is full. Remove unused photos first." : `Couldn't upload ${f.name}. Try a JPG or PNG.`, true); }
    if (ED) { ED.uploading--; renderEditorKeep(); }
  }
}
function renderEditorKeep() { const sc = $("#sheet").scrollTop; renderEditor(); $("#sheet").scrollTop = sc; }
async function saveEditor() {
  const errEl = $("#edErr"); errEl.textContent = "";
  const price = num(ED.price, NaN), sale = ED.salePrice === "" || ED.salePrice == null ? null : num(ED.salePrice, NaN);
  const bad = (id, msg) => { const el = $("#"+id); el && el.closest(".field").classList.add("bad"); errEl.textContent = msg; el && el.focus(); return false; };
  if (!ED.name.trim()) return bad("e-name", "Give the product a name.");
  if (!ED.cat || !catById(ED.cat)) return bad("e-cat", "Choose the section and category this product belongs to.");
  if (!(price > 0)) return bad("e-price", "Enter a price above zero.");
  if (sale !== null && !(sale > 0 && sale < price)) return bad("e-sale", "The promotional price must be lower than the price.");
  const sizes = ED.sizes.map(s => ({size:String(s.size).trim(), qty:Math.max(0, Math.floor(num(s.qty)))})).filter(s => s.size);
  if (!sizes.length) { errEl.textContent = "Add at least one size."; return; }
  if (new Set(sizes.map(s=>s.size)).size !== sizes.length) { errEl.textContent = "Each size must be different."; return; }
  const colors = ED.colors.map(c => ({name:String(c.name).trim() || "Colour", nameAr:String(c.nameAr||"").trim().slice(0,40), hex:hexOk(c.hex)}));
  const id = ED.id || (slug(ED.name) + "-" + rid());
  const body = {
    name: ED.name.trim().slice(0,80), nameAr: String(ED.nameAr||"").trim().slice(0,80), cat: ED.cat, desc: ED.desc.trim().slice(0,1500), descAr: String(ED.descAr||"").trim().slice(0,1500), badge: ED.badge, active: !!ED.active, isNew: !!ED.isNew,
    price: Math.round(price*100)/100, salePrice: sale === null ? null : Math.round(sale*100)/100,
    images: ED.images.slice(0,12), colors, sizes: sizes.map(s=>s.size), stock: Object.fromEntries(sizes.map(s=>[s.size, s.qty])),
    specs: ED.specs.filter(s => String(s[0]).trim() || String(s[2]||"").trim()).map(s => [String(s[0]).trim().slice(0,40) || String(s[2]||"").trim().slice(0,40), String(s[1]).trim().slice(0,80), String(s[2]||"").trim().slice(0,40), String(s[3]||"").trim().slice(0,80)]),
    art: ED.art || "giftbox", sku: ED.sku.trim().slice(0,30), order: ED.order ?? (S.products.length + 1), createdAt: ED.createdAt || Date.now(), updatedAt: Date.now()
  };
  busy = true;
  const ok = await dbw(() => S.db.doc("products/" + id).set(body), ED.isNewDoc ? `${body.name} added` : `${body.name} saved`);
  busy = false;
  if (ok) closeAll();
}

async function saveStaff(form) {
  const errEl = $("#staffErr"); const fail = m => { errEl.textContent = m; };
  const name = $("#sName").value.trim().slice(0, 60), email = normEmail($("#sEmail").value);
  const st = PANEL.id ? AU.staff[PANEL.id] : null;
  if (!name) return fail("Enter the assistant's name.");
  if (!st) {
    if (!emailOk(email)) return fail("Enter a valid email address.");
    if (AU.staff[email]) return fail("There's already a staff account with this email.");
    if (AU.myAuth && normEmail(AU.myAuth.email) === email) return fail("That's the main admin's email. Use the assistant's own email.");
  }
  const perms = {}; SECTIONS.forEach(([k]) => { const r = form.querySelector(`input[name="perm-${k}"]:checked`); perms[k] = r ? r.value : "none"; });
  if (!Object.values(perms).some(v => v !== "none")) return fail("Give this assistant access to at least one section.");
  busy = true;
  if (st) {
    const ok = await dbw(() => S.db.doc("staff/" + st.id).update({name, perms, updatedAt: Date.now()}), `Updated access for ${name}`);
    busy = false; if (ok) { PANEL.perms = perms; renderStaffPanel(); }
    return;
  }
  const code = newInviteCode();
  const sec = await makeSecret(stripCode(code));
  const ok = await dbw(() => S.db.doc("staff/" + email).set({name, email, role: "assistant", perms, active: true, invite: sec, invitedAt: Date.now(), updatedAt: Date.now()}), `Added assistant ${name} (${email})`);

}

});

function edInput(t) {
